name: MahaGov-Pulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Statutory & Cryptographic Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn sqlalchemy aiosqlite cryptography python-jose[cryptography] pydantic pytest pytest-asyncio qrcode pillow reportlab charset-normalizer

    - name: Initialize & Seed Database
      working-directory: ./backend
      run: |
        python seed_data.py || true
        python seed_active_certs.py

    - name: Execute Full Test Suite (15/15 Tests)
      working-directory: ./backend
      run: |
        pytest tests/ -v --tb=short
