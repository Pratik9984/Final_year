    <text x="419" y="70" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">🎯 MahaDBT Scheme Matcher</text>

    <rect x="564" y="44" width="250" height="42" rx="6" fill="rgba(255,255,255,0.05)" stroke="#10b981" stroke-width="1"/>
